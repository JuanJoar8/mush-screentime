name: CI

# Documentation changes spend nothing. Several of the runs that emptied this
# account's Actions allowance on 2026-09-07 were doc-only commits that rebuilt
# the whole app on a macOS runner, which bills at ten times the Linux rate.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-Swift domain logic. No simulator, no signing, no Apple account. Fast, and it is
  # where the brain-health model is actually proven correct.
  kit:
    name: MushKit tests
    # This job spent one commit on ubuntu-latest and came straight back.
    #
    # The move was for cost — macOS bills at 10x — and the reasoning was that MushKit
    # "imports Foundation and nothing else". That is true and it is not the same claim as
    # portable: `FileManager.containerURL(forSecurityApplicationGroupIdentifier:)` is App
    # Group API and exists only on Darwin, so the package does not build on Linux at all.
    #
    # The fix would have been a fake container path under `#if canImport(Darwin)` — a code
    # path for a platform this app will never run on, behaving differently in tests than in
    # production. The repository went public in the same hour, which makes Actions free, so
    # the reason for the contortion evaporated before the contortion was written.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Test
        working-directory: Packages/MushKit
        run: swift test --enable-code-coverage

  # Full app + all five extensions, built for the Simulator. Simulator builds are not
  # code-signed, so this needs no certificate, no provisioning profile and no paid
  # membership (docs/06-APPLE-REQUIREMENTS.md).
  app:
    name: Build + screenshot
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The Screen Time frameworks are Swift-only, so the iOS SDK ships their full public
      # interface as text. Printing the enums we switch over is how we find out that a new
      # SDK added a case *without guessing its name* — the one rule this project cannot
      # break (docs/00-STATUS.md housekeeping rule 3). It lives in this job rather than in
      # the test job because it needs the iOS SDK, which only exists on a Mac.
      - name: Screen Time enum surface
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          for FRAMEWORK in FamilyControls ManagedSettings ManagedSettingsUI DeviceActivity; do
            IFACE=$(find "$SDK/System/Library/Frameworks/$FRAMEWORK.framework"               -name 'arm64*.swiftinterface' -print -quit)
            [ -n "$IFACE" ] || { echo "===== $FRAMEWORK: no interface ====="; continue; }
            echo "===== $FRAMEWORK enums ====="
            grep -nE "public enum (AuthorizationStatus|ShieldAction|ShieldActionResponse|ActivityCategoryPolicy)"               -A 34 "$IFACE" || true
            echo "===== $FRAMEWORK: new in iOS 26.x ====="
            grep -nE "@available\(iOS 26" -A 10 "$IFACE"               | grep -vE "@available\((macOS|tvOS|watchOS|visionOS|macCatalyst|iOS)"               | grep -E "(func|var|case|init|struct|enum|protocol|typealias) "               | head -120 || echo "(none)"
            cp "$IFACE" "interface-$FRAMEWORK.swiftinterface"
          done

      - name: Keep the interfaces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-time-interfaces
          path: interface-*.swiftinterface

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes --json \
            | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
          DEVTYPE=$(xcrun simctl list devicetypes --json \
            | jq -r '[.devicetypes[] | select(.name|test("^iPhone 1[6-9] Pro$"))] | last | .identifier')
          if [ -z "$DEVTYPE" ] || [ "$DEVTYPE" = "null" ]; then
            DEVTYPE=$(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.name|test("^iPhone"))] | last | .identifier')
          fi
          echo "Runtime: $RUNTIME"
          echo "Device type: $DEVTYPE"
          UDID=$(xcrun simctl create MushSim "$DEVTYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # `tee` before xcbeautify on purpose: xcbeautify prints the warning line but eats
      # the "note: add missing case '.foo'" that follows it, which is the only part that
      # says what to write. The raw log keeps it.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mush.xcodeproj \
            -scheme Mush \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild.log | xcbeautify

      - name: Compiler warnings, in full
        if: always()
        run: |
          if grep -qE "warning:" xcodebuild.log; then
            grep -nE "warning:|note:" -A 4 xcodebuild.log | grep -vE "^\-\-$" | head -80
          else
            echo "No compiler warnings."
          fi

      # Path B's whole measurement path is a Shortcuts automation calling an App Intent.
      # An intent that fails to register produces no error and no log line — the
      # automation simply does nothing, and usage silently reads as zero. Assert the
      # metadata exists and names our intents, so that failure is a red build.
      - name: App Intents are registered
        run: |
          set -euo pipefail
          META="build/Build/Products/Debug-iphonesimulator/Mush.app/Metadata.appintents"
          if [ ! -d "$META" ]; then
            echo "Mush.app has no Metadata.appintents — no intent would be callable."
            exit 1
          fi
          for INTENT in LogAppOpenIntent LogAppCloseIntent InterruptIntent StartFocusIntent EndFocusIntent; do
            if grep -rqs "$INTENT" "$META"; then
              echo "ok  $INTENT"
            else
              echo "MISSING  $INTENT"
              exit 1
            fi
          done

      - name: Launch and capture every screen
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/Build/Products/Debug-iphonesimulator/Mush.app"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for SCREEN in home blocks stats brain gallery setup cleanfeed; do
            xcrun simctl terminate "$UDID" com.mush.app || true
            xcrun simctl launch "$UDID" com.mush.app -MushScreen "$SCREEN"
            sleep 5
            xcrun simctl io "$UDID" screenshot "screenshots/$SCREEN.png"
          done

      # A screen that renders nothing still screenshots fine, and the build stays green
      # while the app is visibly broken - which is exactly what happened to the stage
      # gallery: five animated canvases never presented a frame inside the wait below, and
      # CI called it a success. Measure the pixels instead of trusting them.
      #
      # The first version of this shelled out to ImageMagick, which is not on the runner.
      # It reported -1 for every image, skipped them all, and passed - a guard that guards
      # nothing is worse than none, because it also removes the suspicion. CoreGraphics is
      # here by definition: this job builds an iOS app with Xcode.
      - name: Screens actually rendered
        run: swift scripts/screen-not-blank.swift 6 screenshots/*.png

      # A blank screen is almost always a crash on launch, and the difference between
      # "blank" and a stack trace is the difference between guessing and knowing. Only
      # runs when the check above failed, so a green build stays quiet.
      - name: Why it was blank
        if: failure()
        run: |
          echo "--- crash reports ---"
          find ~/Library/Logs/DiagnosticReports -name 'Mush*' -newermt '-20 minutes' 2>/dev/null \
            | while read -r REPORT; do
                echo "=== $REPORT ==="
                head -80 "$REPORT"
              done
          echo "--- last app output ---"
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show \
            --style compact --last 10m \
            --predicate 'process == "Mush" OR senderImagePath CONTAINS "Mush"' 2>/dev/null \
            | tail -60 || echo "(no log)"

      # The progress page shipped twice with an invisible creature: a name collision threw
      # inside requestAnimationFrame, and a canvas nothing draws on looks exactly like a
      # canvas nothing was meant to be on. No linter sees that; only running it does.
      - name: The console still draws its creature
        run: node scripts/check-console.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/

      - name: Tear down
        if: always()
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
