name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-Swift domain logic. No simulator, no signing, no Apple account. Fast, and it is
  # where the brain-health model is actually proven correct.
  kit:
    name: MushKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # The Screen Time frameworks are Swift-only, so the iOS SDK ships their full public
      # interface as text. Printing the enums we switch over is how we find out that a new
      # SDK added a case *without guessing its name* — the one rule this project cannot
      # break (docs/00-STATUS.md housekeeping rule 3).
      - name: Screen Time enum surface
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          for FRAMEWORK in FamilyControls ManagedSettings ManagedSettingsUI DeviceActivity; do
            IFACE=$(find "$SDK/System/Library/Frameworks/$FRAMEWORK.framework" \
              -name 'arm64*.swiftinterface' -print -quit)
            [ -n "$IFACE" ] || { echo "===== $FRAMEWORK: no interface ====="; continue; }
            echo "===== $FRAMEWORK enums ====="
            grep -nE "public enum (AuthorizationStatus|ShieldAction|ShieldActionResponse|ActivityCategoryPolicy)" \
              -A 34 "$IFACE" || true
            # Everything the 26.x SDKs added. This whole architecture is built on two
            # limitations — the report-extension sandbox and a shield's inability to open
            # our app (docs/01-FEASIBILITY.md L2 and section 3) — and the 26.4/26.5 SDK
            # visibly moves at least one of them. Reading the shipped interface is the
            # only way to find out what changed without guessing an API into existence.
            echo "===== $FRAMEWORK: new in iOS 26.x ====="
            grep -nE "@available\(iOS 26" -A 10 "$IFACE" \
              | grep -vE "@available\((macOS|tvOS|watchOS|visionOS|macCatalyst|iOS)" \
              | grep -E "(func|var|case|init|struct|enum|protocol|typealias) " \
              | head -120 || echo "(none)"
            cp "$IFACE" "interface-$FRAMEWORK.swiftinterface"
          done

      # DeviceActivity is where this architecture is decided. iOS 26 added
      # `activityData(filteredBy:using:)` returning an AsyncSequence with a `.live` policy
      # and an `.unauthorized` error - which is exactly what an API for reading usage
      # *outside* the report extension would look like. Section 3 of 01-FEASIBILITY.md
      # says that is impossible. Print the declarations before believing either version.
      - name: DeviceActivity, in full
        run: |
          grep -nE "^(@available\(iOS|public|  public|  @available\(iOS|})"             interface-DeviceActivity.swiftinterface | head -220

      - name: Keep the interfaces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-time-interfaces
          path: interface-*.swiftinterface

      - name: Test
        working-directory: Packages/MushKit
        run: swift test --enable-code-coverage

  # Full app + all five extensions, built for the Simulator. Simulator builds are not
  # code-signed, so this needs no certificate, no provisioning profile and no paid
  # membership (docs/06-APPLE-REQUIREMENTS.md).
  app:
    name: Build + screenshot
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes --json \
            | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | last | .identifier')
          DEVTYPE=$(xcrun simctl list devicetypes --json \
            | jq -r '[.devicetypes[] | select(.name|test("^iPhone 1[6-9] Pro$"))] | last | .identifier')
          if [ -z "$DEVTYPE" ] || [ "$DEVTYPE" = "null" ]; then
            DEVTYPE=$(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.name|test("^iPhone"))] | last | .identifier')
          fi
          echo "Runtime: $RUNTIME"
          echo "Device type: $DEVTYPE"
          UDID=$(xcrun simctl create MushSim "$DEVTYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # `tee` before xcbeautify on purpose: xcbeautify prints the warning line but eats
      # the "note: add missing case '.foo'" that follows it, which is the only part that
      # says what to write. The raw log keeps it.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mush.xcodeproj \
            -scheme Mush \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild.log | xcbeautify

      - name: Compiler warnings, in full
        if: always()
        run: |
          if grep -qE "warning:" xcodebuild.log; then
            grep -nE "warning:|note:" -A 4 xcodebuild.log | grep -vE "^\-\-$" | head -80
          else
            echo "No compiler warnings."
          fi

      # Path B's whole measurement path is a Shortcuts automation calling an App Intent.
      # An intent that fails to register produces no error and no log line — the
      # automation simply does nothing, and usage silently reads as zero. Assert the
      # metadata exists and names our intents, so that failure is a red build.
      - name: App Intents are registered
        run: |
          set -euo pipefail
          META="build/Build/Products/Debug-iphonesimulator/Mush.app/Metadata.appintents"
          if [ ! -d "$META" ]; then
            echo "Mush.app has no Metadata.appintents — no intent would be callable."
            exit 1
          fi
          for INTENT in LogAppOpenIntent LogAppCloseIntent InterruptIntent StartFocusIntent EndFocusIntent; do
            if grep -rqs "$INTENT" "$META"; then
              echo "ok  $INTENT"
            else
              echo "MISSING  $INTENT"
              exit 1
            fi
          done

      - name: Launch and capture every screen
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/Build/Products/Debug-iphonesimulator/Mush.app"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for SCREEN in home blocks stats brain gallery setup; do
            xcrun simctl terminate "$UDID" com.mush.app || true
            xcrun simctl launch "$UDID" com.mush.app -MushScreen "$SCREEN"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$SCREEN.png"
          done

      # A screen that renders nothing still screenshots fine, and the build stays green
      # while the app is visibly broken - which is exactly what happened to the stage
      # gallery: five animated canvases never presented a frame inside the six seconds
      # below, and CI called it a success. Measure the pixels instead of trusting them.
      - name: Screens actually rendered
        run: |
          set -euo pipefail
          FAILED=0
          for SHOT in screenshots/*.png; do
            # Standard deviation over the whole image. A blank or single-colour screen
            # sits near zero; any real UI is far above it.
            SIGMA=$(magick "$SHOT" -colorspace Gray -format "%[fx:standard_deviation*100]" info: 2>/dev/null || echo "-1")
            printf "%-28s sigma=%s
" "$(basename "$SHOT")" "$SIGMA"
            if [ "$SIGMA" = "-1" ]; then
              echo "  (could not measure - skipping)"
              continue
            fi
            if awk "BEGIN{exit !($SIGMA < 2.0)}"; then
              echo "  BLANK: $(basename "$SHOT") rendered nothing."
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/

      - name: Tear down
        if: always()
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
